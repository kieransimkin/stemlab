[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danceflow-stemlab"
version = "0.2.0"
description = "Multi-model music stem separation, structural, harmonic, rhythmic, sonic and semantic analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kieran Simkin"}]
maintainers = [{name = "Kieran Simkin"}]
keywords = ["music", "audio", "source separation", "MIR", "music information retrieval", "spectrogram", "lyrics", "rhythm", "harmony"]
dependencies = [
  "numpy",
  "scipy",
  "torch>=2.4",
  "torchaudio>=2.4",
  "soundfile>=0.12",
  "matplotlib",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
  # Lightweight, deterministic high-level analysis used by the default pipeline.
  "librosa>=0.11",
  "pyloudnorm>=0.2",
  "cmudict>=1.1.3",
]

[project.urls]
Homepage = "https://kieransimkin.co.uk/"
"My Songs" = "https://kieransimkin.co.uk/my-songs/"
"Arcadians showcase" = "https://kieransimkin.co.uk/arcadians/"
Repository = "https://github.com/kieransimkin/stemlab"
Issues = "https://github.com/kieransimkin/stemlab/issues"
"About Kieran" = "https://kieransimkin.co.uk/about-me/"
Contact = "https://kieransimkin.co.uk/contact/"

[project.optional-dependencies]
separation = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
]
speech = ["faster-whisper"]
beats = ["beat-this>=1.1.0", "BeatNet"]
# Modern functional structure + lyric semantic embeddings. all-in-one-infer
# 3.1.0 now declares Python >=3.9 and uses pure-PyTorch compatibility layers.
deep = [
  "sentence-transformers>=6.1,<7",
  "all-in-one-infer>=3.1",
]
# MuQ-MuLan's released model weights are CC-BY-NC 4.0. Keep this explicit and
# opt-in rather than silently pulling a non-commercial checkpoint into `all`.
semantic-nc = ["muq"]
# Basic Pitch is valuable on isolated guitar/piano/bass/vocal stems, but its
# current runtime matrix is safest on Python 3.10/3.11.
amt = ["basic-pitch>=0.4,<0.5; python_version < '3.12'"]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]
binary = ["nuitka>=2.7", "ordered-set>=4.1", "zstandard>=0.23"]
all = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
  "faster-whisper",
  "beat-this>=1.1.0",
  "BeatNet",
  "sentence-transformers>=6.1,<7",
  "all-in-one-infer>=3.1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]

[project.scripts]
stemlab = "stemlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stemlab = ["web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/*.jpg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
