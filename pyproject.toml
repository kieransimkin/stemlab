[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemlab"
version = "0.1.0"
description = "Multi-model PyTorch music stem separation and analysis pipeline"
readme = "README.md"
authors = [{name = "StemLab contributors"}]
dependencies = [
  "numpy",
  "scipy",
  "torch>=2.4",
  "torchaudio>=2.4",
  "soundfile>=0.12",
  "matplotlib",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
separation = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
]
speech = ["faster-whisper"]
beats = ["beat-this>=1.1.0", "BeatNet"]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]
binary = ["nuitka>=2.7", "ordered-set>=4.1", "zstandard>=0.23"]
all = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
  "faster-whisper",
  "beat-this>=1.1.0",
  "BeatNet",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]

[project.scripts]
stemlab = "stemlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stemlab = ["web/*.html", "web/*.css", "web/*.js", "web/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI's lint contract explicit. New Ruff releases may add or enable
# additional rule families; CI should not start failing solely because the
# resolver selected a newer Ruff version.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
