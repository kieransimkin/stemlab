[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danceflow-stemlab"
dynamic = ["version"]
description = "Local music analysis for stems, timing, beats, harmony, lyrics, MIDI and loopable sections for Shorts. https://kieransimkin.co.uk/"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kieran Simkin"}]
maintainers = [{name = "Kieran Simkin"}]
license = "MIT"
keywords = ["music", "audio", "MIR", "source separation", "BPM", "rhythm", "harmony", "DanceFlow", "DanceMoves", "motion response", "WordPress"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy",
  "scipy",
  "torch>=2.4",
  "torchaudio>=2.4",
  "soundfile>=0.12",
  "matplotlib",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
  # Lightweight, deterministic high-level analysis used by the default pipeline.
  "librosa>=0.11",
  "pyloudnorm>=0.2",
  "cmudict>=1.1.3",
]

[project.urls]
"DanceFlow ecosystem" = "https://kieransimkin.co.uk/danceflow/"
Homepage = "https://kieransimkin.co.uk/"
"My Songs portfolio" = "https://kieransimkin.co.uk/my-songs/"
"Arcadians showcase" = "https://kieransimkin.co.uk/arcadians/"
Repository = "https://github.com/kieransimkin/stemlab"
Issues = "https://github.com/kieransimkin/stemlab/issues"
Documentation = "https://github.com/kieransimkin/stemlab/tree/main/docs"
Changelog = "https://github.com/kieransimkin/stemlab/blob/main/CHANGELOG.md"
"About Kieran" = "https://kieransimkin.co.uk/about-me/"
Contact = "https://kieransimkin.co.uk/contact/"

[project.optional-dependencies]
# Explicit opt-in: native motions/catalogue stay entirely in DanceRudiments.
rudiments = ["dancerudiments>=0.2.4,<1"]
# Local MCP transport and read-only viewer for the existing React timeline.
# Model backends remain separately selected; no duplicate React bundle is shipped.
codex = ["mcp>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
separation = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
  "bs-roformer-infer>=0.1.5",
]
speech = ["faster-whisper"]
# BeatNet's published wheel has obsolete NumPy/Numba metadata. StemLab's
# checksum-verified bootstrap exposes its code without resolving those pins;
# this maintained binary supplies the compatible offline DBN decoder.
beats = ["beat-this>=1.1.0", "madmom-prebuilt==0.17.post1; python_version >= '3.11'", "mido>=1.2.6"]
# Modern functional structure + lyric semantic embeddings. all-in-one-infer
# 3.1.0 now declares Python >=3.9 and uses pure-PyTorch compatibility layers.
deep = [
  "sentence-transformers>=6.1,<7",
  "all-in-one-infer>=3.1",
]
# MuQ-MuLan's released model weights are CC-BY-NC 4.0. Keep this explicit and
# opt-in rather than silently pulling a non-commercial checkpoint into `all`.
semantic-nc = ["muq"]
# Basic Pitch is valuable on isolated guitar/piano/bass/vocal stems, but its
# current runtime matrix is safest on Python 3.10/3.11.
amt = ["basic-pitch>=0.4,<0.5; python_version < '3.12'"]
# MIDI infrastructure is light; install heavy/incompatible model extras separately.
midi = ["pretty-midi>=0.2.10,<0.3", "mido>=1.3,<2", "psutil>=5.9"]
midi-piano = ["pretty-midi>=0.2.10,<0.3", "mido>=1.3,<2", "psutil>=5.9",
              "piano-transcription-inference==0.0.6"]
midi-transkun = ["pretty-midi>=0.2.10,<0.3", "mido>=1.3,<2", "psutil>=5.9",
                "transkun==2.0.1", "setuptools<81"]
# Explicit opt-in: the upstream wrapper contains third-party source with mixed
# licence status. Only mr_mt3/yourmt3 are selectable here; see docs/midi.md.
midi-mt3 = ["pretty-midi>=0.2.10,<0.3", "mido>=1.3,<2", "psutil>=5.9",
            "mt3-infer[torch]==0.2.0"]
# Complementary evidence backends remain opt-in and independent.
evidence = ["psutil>=5.9"]
evidence-vocals = ["psutil>=5.9", "fireredvad>=0.0.2,<0.1"]
evidence-pitch = ["psutil>=5.9", "swift-f0[audio]>=0.3,<0.4"]
evidence-align = ["psutil>=5.9", "qwen-asr"]
evidence-chords = ["psutil>=5.9", "lv-chordia"]
# HeartTranscriptor, SongFormer and ADTOF-pytorch are installed from their
# upstream research repositories/environments; do not hide that provenance in
# the normal StemLab dependency graph.
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "tomli>=2; python_version < '3.11'", "httpx2"]
binary = ["nuitka>=2.7", "ordered-set>=4.1", "zstandard>=0.23", "lazy-loader==0.4"]
all = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
  "bs-roformer-infer>=0.1.5",
  "faster-whisper",
  "beat-this>=1.1.0",
  "madmom-prebuilt==0.17.post1; python_version >= '3.11'",
  "mido>=1.2.6",
  "sentence-transformers>=6.1,<7",
  "all-in-one-infer>=3.1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-socketio>=5.12,<6",
]

[project.scripts]
stemlab = "stemlab.cli:app"
stemlab-codex = "stemlab.codex.__main__:main"
# Distribution-name alias lets generic MCP registry clients launch the PyPI package.
danceflow-stemlab = "stemlab.codex.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "stemlab.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stemlab = ["web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/*.jpg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/stemlab/branding" = ["docs/branding/logo.svg", "docs/branding/logo-monochrome.svg", "docs/branding/logo.png", "docs/branding/README.md"]
