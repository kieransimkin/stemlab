[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemlab"
version = "0.1.0"
description = "Multi-model PyTorch music stem separation and analysis pipeline"
readme = "README.md"
authors = [{name = "StemLab contributors"}]
dependencies = [
  "numpy",
  "scipy",
  "torch>=2.4",
  "torchaudio>=2.4",
  "soundfile>=0.12",
  "matplotlib",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
separation = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
]
speech = ["faster-whisper"]
beats = ["beat-this>=1.1.0", "BeatNet"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]
binary = ["nuitka>=2.7", "ordered-set>=4.1", "zstandard>=0.23"]
all = [
  "demucs>=4.0.1",
  "openunmix>=1.3.0",
  "faster-whisper",
  "beat-this>=1.1.0",
  "BeatNet",
]

[project.scripts]
stemlab = "stemlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
