name: Standalone CLI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binary.yml'
      - '.github/workflows/release.yml'
      - 'pyproject.toml'
      - 'src/stemlab/**'
      - 'scripts/build_onefile.py'
      - 'scripts/check_onefile.py'
      - 'scripts/stemlab_onefile_entry.py'
      - 'tests/test_onefile_build.py'

permissions:
  contents: read

# A new main build supersedes an older main binary build. Tags use their own
# ref-specific group and therefore cannot cancel a main build or another tag.
concurrency:
  group: stemlab-onefile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test Linux one-file CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Native runtime requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libsndfile1 ffmpeg

      - name: Install one-file build environment
        run: |
          python -m pip install -U pip wheel setuptools

          # madmom-prebuilt remains legacy-sensitive.
          python -m pip install 'Cython<3' 'numpy<2'

          # The CLI bundle does not need CUDA/NVIDIA runtime libraries.
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch torchaudio

          python -m pip install -e '.[all,binary]'

      - name: Build checksum-pinned standalone CLI with PyInstaller
        env:
          STEMLAB_CACHE: ${{ runner.temp }}/stemlab-onefile-cache
        run: |
          python scripts/build_onefile.py \
            --output-dir build/onefile \
            --output-name stemlab-linux-x86_64

      - name: Smoke-test actual executable with an empty external cache
        env:
          STEMLAB_CACHE: ${{ runner.temp }}/stemlab-onefile-smoke-cache
        run: |
          python scripts/check_onefile.py \
            build/onefile/stemlab-linux-x86_64

      - name: Upload validated standalone CLI
        uses: actions/upload-artifact@v7
        with:
          name: stemlab-onefile-linux-x86_64
          path: |
            build/onefile/stemlab-linux-x86_64
            build/onefile/build-info.json
          if-no-files-found: error
          retention-days: 14
