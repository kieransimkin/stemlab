name: Standalone CLI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binary.yml'
      - '.github/workflows/release.yml'
      - 'pyproject.toml'
      - 'src/stemlab/**'
      - 'scripts/build_onefile.py'
      - 'scripts/check_onefile.py'
      - 'scripts/stemlab_onefile_entry.py'
      - 'tests/test_onefile_build.py'

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test Linux one-file CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libsndfile1 ffmpeg

      - name: Install the one-file build environment
        run: |
          python -m pip install -U pip wheel setuptools
          # madmom-prebuilt and the verified BeatNet runtime are supported together
          # on the binary build's Python 3.11 environment.
          python -m pip install 'Cython<3' 'numpy<2'
          python -m pip install -e '.[all,binary]'

      - name: Build checksum-pinned standalone CLI
        env:
          STEMLAB_CACHE: ${{ runner.temp }}/stemlab-onefile-cache
        run: |
          python scripts/build_onefile.py \
            --output-dir build/nuitka \
            --output-name stemlab-linux-x86_64

      - name: Smoke-test the actual executable with an empty external cache
        env:
          STEMLAB_CACHE: ${{ runner.temp }}/stemlab-onefile-smoke-cache
        run: |
          python scripts/check_onefile.py build/nuitka/stemlab-linux-x86_64

      - name: Upload validated standalone CLI
        uses: actions/upload-artifact@v7
        with:
          name: stemlab-onefile-linux-x86_64
          path: |
            build/nuitka/stemlab-linux-x86_64
            build/nuitka/build-info.json
          if-no-files-found: error
          retention-days: 14
