name: Recording batch and shared visualizer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dancerudiments_ref:
        description: 'Companion recording/harness ref or SHA (merge companion first)'
        type: string
        required: false
permissions:
  contents: read
jobs:
  recordings:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    env:
      STEMLAB_REQUIRE_RECORDINGS: '1'
      DANCERUDIMENTS_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kieransimkin/DanceRudiments
          ref: ${{ inputs.dancerudiments_ref || vars.DANCERUDIMENTS_RECORDING_REF || 'main' }}
          path: .recording-dancerudiments
      - name: Report exact companion revision
        run: git -C .recording-dancerudiments rev-parse HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build actual companion package and install lightweight test dependencies
        run: |
          python -m pip install numpy scipy soundfile matplotlib rich "typer>=0.12" platformdirs pytest playwright
          python -m pip install ./.recording-dancerudiments
          python -m pip install --no-deps -e .
      - name: Require new shared APIs and native class; no fallback/skip
        run: python -c "from dancerudiments_authoring.harness import build_recording_harness; from dancerudiments import SampledRecording"
      - name: DSP, routing, mandatory BPM, native playback and matching regressions
        run: python -m pytest tests/test_rudiment_recordings.py tests/test_rudiment_matches.py
      - name: Generate master/stem synthetic examples and a 48-candidate batch
        run: python examples/recordings/generate_demo.py --output recording-demo
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify real local-file comparison, native samples, audio clock and reviews
        run: python .recording-dancerudiments/tools/test_recording_harness.py recording-demo/batch/index.html --screenshot recording-comparison.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recordings-${{ matrix.os }}-${{ matrix.python }}
          path: |
            recording-demo/
            recording-comparison.png
          if-no-files-found: warn
