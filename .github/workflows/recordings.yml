name: Recording batch and shared visualizer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recordings:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    env:
      STEMLAB_REQUIRE_RECORDINGS: '1'
      DANCERUDIMENTS_REQUIRE_NATIVE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Require the latest stable published companion releases
        id: companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_viewer_build.py --latest --outputs "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: kieransimkin/DanceRudiments
          ref: ${{ steps.companion.outputs.ref }}
          path: .recording-dancerudiments
      - name: Report exact companion revision
        run: git -C .recording-dancerudiments rev-parse HEAD
      - name: Install the verified published wheel and lightweight test dependencies
        run: |
          python -m pip install numpy scipy soundfile matplotlib rich "typer>=0.12" platformdirs pytest pyyaml playwright
          python scripts/viewer_releases.py install
          python -m pip install --no-deps -e .
      - name: Require new shared APIs and native class; no fallback/skip
        run: python -c "from dancerudiments_authoring.harness import build_recording_harness, HARNESS_DISPLAY_API_VERSION; assert HARNESS_DISPLAY_API_VERSION == 1; from dancerudiments import SampledRecording"
      - name: DSP, routing, mandatory BPM, native playback and matching regressions
        run: python -m pytest tests/test_rudiment_recordings.py tests/test_frequency_bands.py tests/test_rudiment_matches.py tests/test_rudiment_pairs.py tests/test_arcadians_pair_demos.py tests/test_arcadians_fourier_demo.py
      - name: Generate master/stem synthetic examples and a 48-candidate batch
        run: python examples/recordings/generate_demo.py --output recording-demo
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify real local-file comparison, native samples, audio clock and reviews
        run: python .recording-dancerudiments/tools/test_recording_harness.py recording-demo/batch/index.html --screenshot recording-comparison.png
      - name: Verify new stem-pair and smoothing comparison harnesses
        run: |
          python .recording-dancerudiments/tools/test_recording_harness.py recording-demo/stem-pairs/index.html --screenshot stem-pairs-comparison.png
          python .recording-dancerudiments/tools/test_recording_harness.py recording-demo/averages/index.html --screenshot averages-comparison.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recordings-${{ matrix.os }}-${{ matrix.python }}
          path: |
            recording-demo/
            recording-comparison.png
            stem-pairs-comparison.png
            averages-comparison.png
          if-no-files-found: warn
