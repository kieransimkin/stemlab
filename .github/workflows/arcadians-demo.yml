name: Arcadians release demo

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/arcadians-demo.yml'
      - '.github/workflows/release.yml'
      - '.github/dancerudiments-recording-ref'
      - 'scripts/build_arcadians_demo.py'
      - 'scripts/check_arcadians_audio.py'
      - 'scripts/arcadians_http.py'
      - '.github/workflows/arcadians-timeline.yml'
      - 'scripts/build_arcadians_timeline.py'
      - 'src/stemlab/analysis/midi/**'
      - 'tests/test_midi*.py'
      - 'scripts/build_arcadians_pair_demos.py'
      - 'scripts/build_arcadians_fourier_demo.py'
      - 'scripts/recording_downloads.py'
      - 'src/stemlab/analysis/frequency_bands.py'
      - 'tests/test_arcadians_fourier_demo.py'
      - 'scripts/check_viewer_build.py'
      - 'scripts/timeline_display_checks.py'
      - 'web-client/**'
      - '.github/viewer-*.json'
      - 'scripts/viewer_releases.py'
      - 'package*.json'
      - 'src/stemlab/analysis/rudiment_pairs.py'
      - 'src/stemlab/recording_cli.py'
      - 'tests/test_rudiment_pairs.py'
      - 'tests/test_arcadians_pair_demos.py'
      - 'scripts/check_torchaudio_decode.py'
      - 'scripts/check_semantic_runtime.py'
      - 'tests/test_arcadians_runtime.py'
      - 'docker/**'
      - 'scripts/check_arcadians_timeline.py'
      - 'scripts/assemble_arcadians_site.py'
      - 'src/stemlab/static_timeline.py'
      - 'src/stemlab/analysis/beat_offsets.py'
      - 'scripts/build_beat_example.py'
      - 'scripts/beat_offset_browser_checks.py'
      - 'examples/the-truth-is-a-virus/**'
      - 'src/stemlab/web/**'
      - 'tests/test_static_timeline.py'
      - 'tests/test_arcadians_timeline.py'
      - 'tests/test_arcadians_http.py'
      - 'src/stemlab/analysis/rudiment_recordings.py'
      - 'src/stemlab/analysis/rudiment_batch.py'
      - 'src/stemlab/beats/**'
      - 'src/stemlab/pipeline.py'
      - 'tests/test_beat_inputs.py'
      - 'tests/test_arcadians_release_demo.py'
      - 'examples/arcadians/**'

permissions:
  contents: read

jobs:
  static-regressions:
    name: Check timeline export and combined publication contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies, without model downloads
        run: |
          python -m pip install numpy scipy soundfile matplotlib fastapi rich 'typer>=0.12' platformdirs pytest pyyaml ruff 'pretty-midi>=0.2.10,<0.3' 'psutil>=6,<8'
          python -m pip install --no-deps -e .
      - name: Require latest stable released viewers and rebuilt controls before inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_viewer_build.py --latest
      - name: Lint before expensive analysis
        run: python -m ruff check src tests scripts
      - name: Test static timeline, completeness validation, HTTP and publication
        run: |
          python -m pytest tests/test_static_timeline.py tests/test_arcadians_timeline.py tests/test_arcadians_http.py tests/test_arcadians_pages_publish.py tests/test_arcadians_runtime.py tests/test_beat_inputs.py tests/test_beat_consensus.py tests/test_viewer_controls.py tests/test_beat_offsets.py tests/test_beat_reference.py
      - name: Build the frozen beat reference before expensive inference
        run: python scripts/build_beat_example.py --output "$RUNNER_TEMP/truth-beat-preflight" --source-commit "${{ github.sha }}"

  timeline:
    if: github.event_name != 'pull_request'
    needs: static-regressions
    name: Complete Arcadians analysis and static timeline
    uses: ./.github/workflows/arcadians-timeline.yml
    permissions:
      contents: read

  build:
    needs: timeline
    name: Generate and audition full Arcadians batch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STEMLAB_REQUIRE_RECORDINGS: '1'
      DANCERUDIMENTS_REQUIRE_NATIVE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Read the same verified release snapshot used by the timeline
        id: companion
        shell: bash
        run: python scripts/check_viewer_build.py --outputs "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: kieransimkin/DanceRudiments
          ref: ${{ steps.companion.outputs.ref }}
          path: .recording-dancerudiments
          persist-credentials: false
      - name: Install published native companion and lightweight recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsndfile1 ffmpeg
          python -m pip install numpy scipy 'soundfile>=0.12' matplotlib 'fastapi>=0.115,<1' rich 'typer>=0.12' platformdirs pytest pyyaml playwright
          python scripts/viewer_releases.py install
          python -m pip install --no-deps -e .
          python -c "from dancerudiments import SampledRecording; from dancerudiments_authoring.harness import build_recording_harness, HARNESS_DISPLAY_API_VERSION; assert HARNESS_DISPLAY_API_VERSION == 1"
      - name: Run release-demo and recording regression tests
        run: python -m pytest tests/test_arcadians_http.py tests/test_arcadians_release_demo.py tests/test_rudiment_recordings.py tests/test_frequency_bands.py tests/test_rudiment_matches.py tests/test_rudiment_pairs.py tests/test_arcadians_pair_demos.py tests/test_arcadians_fourier_demo.py
      - name: Generate 48 full-song movements with the original MP3 included
        env:
          RELEASE_LABEL: ${{ github.ref_name }}
          COMPANION_SHA: ${{ steps.companion.outputs.ref }}
        shell: bash
        run: |
          # PR refs contain slashes; preview labels are not release claims.
          LABEL="$RELEASE_LABEL"
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then LABEL="pr-${{ github.event.number }}"; fi
          python scripts/build_arcadians_demo.py build \
            --output dist/arcadians-pages \
            --source-commit "$(git rev-parse HEAD)" \
            --companion-commit "$COMPANION_SHA" \
            --companion-license .recording-dancerudiments/LICENSE \
            --release-tag "$LABEL"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run companion native recording and shared harness regressions
        run: python -m unittest discover -s .recording-dancerudiments/tests/python -p test_recording.py -v
      - name: Require audible source data and synchronized playback under the Pages URL prefix
        run: |
          python scripts/check_arcadians_audio.py dist/arcadians-pages \
            --report dist/arcadians-audio-browser.json --screenshot dist/arcadians-comparison.png
          python scripts/build_arcadians_demo.py verify dist/arcadians-pages
      - name: Retrieve the same analysis run's exact float stems, outside the public site
        uses: actions/download-artifact@v5
        with:
          name: stemlab-arcadians-recording-sources
          path: recording-sources
      - name: Generate stem-pair and average-comparison pages without rerunning separation
        env:
          COMPANION_SHA: ${{ steps.companion.outputs.ref }}
        run: |
          python scripts/build_arcadians_pair_demos.py --sources recording-sources \
            --site dist/arcadians-pages --source-commit "$GITHUB_SHA" \
            --companion-commit "$COMPANION_SHA" --companion-license .recording-dancerudiments/LICENSE
      - name: Verify both additional galleries with original audio and native samples
        run: |
          python scripts/check_arcadians_audio.py dist/arcadians-pages --gallery arcadians-stems \
            --report dist/arcadians-stems-audio-browser.json --screenshot dist/arcadians-stems-comparison.png
          python scripts/check_arcadians_audio.py dist/arcadians-pages --gallery arcadians-averages \
            --report dist/arcadians-averages-audio-browser.json --screenshot dist/arcadians-averages-comparison.png
      - name: Retrieve the complete browser-validated timeline
        uses: actions/download-artifact@v5
        with:
          name: stemlab-arcadians-timeline-pages
          path: timeline-site
      - name: Generate all six full-master Fourier resolutions through the shared recording API
        env:
          COMPANION_SHA: ${{ steps.companion.outputs.ref }}
        run: |
          python scripts/build_arcadians_fourier_demo.py --site dist/arcadians-pages \
            --source-commit "$GITHUB_SHA" --companion-commit "$COMPANION_SHA" \
            --companion-license .recording-dancerudiments/LICENSE
      - name: Verify every Fourier resolution, full-dimensional native samples, bars and audio transport
        shell: bash
        run: |
          for BANDS in 4 8 16 32 64 128; do
            python scripts/check_arcadians_audio.py dist/arcadians-pages --gallery arcadians-fourier --channels "$BANDS" \
              --report "dist/arcadians-fourier-${BANDS}-audio-browser.json" --screenshot "dist/arcadians-fourier-${BANDS}.png"
          done
      - name: Retrieve timeline QA separately, never into the public site
        uses: actions/download-artifact@v5
        with:
          name: stemlab-arcadians-timeline-qa
          path: dist/timeline-qa
      - name: Assemble all five verified viewers into one Pages site
        run: |
          python scripts/assemble_arcadians_site.py --site dist/arcadians-pages \
            --timeline timeline-site --qa dist/timeline-qa/arcadians-timeline-browser.json \
            --source-sha "$GITHUB_SHA"
          cp dist/timeline-qa/arcadians-timeline-browser.json dist/arcadians-timeline-browser.json
      - name: Build and browser-test The Truth is a Virus beat reference
        # The reference is generated from frozen real detections, not synthetic beats.
        run: |
          python scripts/build_beat_example.py --output dist/arcadians-pages/timeline/the-truth-is-a-virus \
            --source-commit "$GITHUB_SHA"
          python scripts/check_arcadians_timeline.py dist/arcadians-pages/timeline/the-truth-is-a-virus \
            --report dist/truth-beat-browser.json
      - name: Require matching HTTP QA for both timelines and all Fourier resolutions
        run: |
          python scripts/publish_arcadians_pages.py verify --site dist/arcadians-pages \
            --qa dist/arcadians-audio-browser.json --source-sha "$GITHUB_SHA"
      - name: Freeze the tested public site as release assets
        run: |
          python scripts/build_arcadians_demo.py package dist/arcadians-pages --output dist/arcadians-release
      - name: Upload only the verified public site
        uses: actions/upload-artifact@v7
        with:
          name: stemlab-arcadians-pages
          path: dist/arcadians-pages/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Arcadians release archive and provenance
        uses: actions/upload-artifact@v7
        with:
          name: stemlab-arcadians-release-assets
          path: dist/arcadians-release/*
          if-no-files-found: error
      - name: Retain browser validation evidence separately from the public site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stemlab-arcadians-browser-qa
          path: |
            dist/arcadians-comparison.png
            dist/arcadians-audio-browser.json
            dist/arcadians-timeline-browser.json
            dist/truth-beat-browser.json
            dist/truth-beat-browser.png
            dist/arcadians-stems-audio-browser.json
            dist/arcadians-averages-audio-browser.json
            dist/arcadians-stems-comparison.png
            dist/arcadians-averages-comparison.png
            dist/arcadians-fourier-*-audio-browser.json
            dist/arcadians-fourier-*.png
          if-no-files-found: warn
