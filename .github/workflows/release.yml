name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-package:
    name: Validate and package Codex plugin
    uses: ./.github/workflows/codex-plugin.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    permissions:
      contents: read

  release-build:
    needs: codex-package
    name: Build and validate StemLab release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libsndfile1 ffmpeg

      - name: Install Python build/runtime dependencies
        run: |
          python -m pip install -U pip wheel setuptools
          # madmom/BeatNet remain legacy-sensitive; preinstall Cython before resolving extras.
          python -m pip install 'Cython<3' 'numpy<2'
          python -m pip install -e '.[all,binary,dev]'
          python -m pip install -U build twine

      - name: Verify release tag matches StemLab version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import importlib.metadata
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          # danceflow-stemlab is only the globally unique PyPI distribution
          # identifier. The canonical project, import and CLI names remain StemLab/stemlab.
          actual = importlib.metadata.version("danceflow-stemlab")
          if actual != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match StemLab package version {actual!r}"
              )
          print(f"StemLab release version verified: {actual}")
          PY

      - name: Test package before release build
        run: |
          python -m compileall -q src tests
          pytest
          ruff check src tests scripts

      - name: Build StemLab wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: Build supplemental StemLab one-file CLI
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=build/nuitka \
            --output-filename=stemlab-linux-x86_64 \
            --include-package=stemlab \
            --include-package=demucs \
            --include-package=openunmix \
            --include-package=bs_roformer \
            --include-package=faster_whisper \
            --include-package=beat_this \
            --include-package=BeatNet \
            --include-package=librosa \
            --include-package=pyloudnorm \
            --include-package=cmudict \
            --include-package=sentence_transformers \
            --include-package=allin1_infer \
            --include-package-data=bs_roformer \
            --include-package-data=faster_whisper \
            src/stemlab/__main__.py

      - name: Retrieve validated Codex plugin assets
        uses: actions/download-artifact@v5
        with:
          name: stemlab-codex-plugin-ubuntu-latest
          path: codex-release

      - name: Assemble StemLab release directory and manifest
        run: |
          mkdir -p dist-release
          cp dist/* dist-release/
          cp codex-release/* dist-release/
          if [[ -f build/nuitka/stemlab-linux-x86_64 ]]; then
            cp build/nuitka/stemlab-linux-x86_64 dist-release/
            chmod +x dist-release/stemlab-linux-x86_64
          else
            printf '%s\n' \
              'The optional Linux one-file executable was not produced.' \
              'Install StemLab from PyPI or use the published container image.' \
              > dist-release/STEMLAB-BINARY-NOTE.txt
          fi
          python scripts/release_about.py dist-release/STEMLAB-ABOUT.txt
          python scripts/release_manifest.py dist-release
          cat dist-release/SHA256SUMS

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: stemlab-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload complete StemLab release assets
        uses: actions/upload-artifact@v4
        with:
          name: stemlab-release-assets
          path: dist-release/*
          if-no-files-found: error

  github-release:
    name: Publish StemLab GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, codex-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve StemLab release assets
        uses: actions/download-artifact@v5
        with:
          name: stemlab-release-assets
          path: dist-release

      - name: Create or update StemLab GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "StemLab ${TAG#v}" \
              --generate-notes
          fi

          gh release view "$TAG" --repo "$REPOSITORY" --json body -q .body > /tmp/release-body.md
          if ! grep -q 'kieransimkin.co.uk/my-songs/' /tmp/release-body.md; then
            cat >> /tmp/release-body.md <<'EOF'

          ---
          **StemLab by Kieran Simkin** — part of DanceFlow

          Related plugin: DanceMoves (WordPress)

          Website: https://kieransimkin.co.uk/
          Music catalogue: https://kieransimkin.co.uk/my-songs/
          Arcadians showcase: https://kieransimkin.co.uk/arcadians/
          Source: https://github.com/kieransimkin/stemlab
          PyPI: https://pypi.org/project/danceflow-stemlab/
          EOF
            gh release edit "$TAG" --repo "$REPOSITORY" --notes-file /tmp/release-body.md
          fi

          gh release upload "$TAG" dist-release/* \
            --repo "$REPOSITORY" \
            --clobber

  container-publish:
    name: Build and publish release container
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate GHCR release image metadata
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Generate Docker Hub release image metadata
        id: meta-dockerhub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/stemlab
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish StemLab release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STEMLAB_BUILD_REF=${{ github.sha }}
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Published release image summary
        run: |
          echo "### Published release container images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-ghcr.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${{ steps.meta-dockerhub.outputs.tags }}" ]]; then
            echo "${{ steps.meta-dockerhub.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pypi-publish:
    name: Publish StemLab to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, codex-package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/danceflow-stemlab
    permissions:
      id-token: write
    steps:
      - name: Retrieve StemLab Python distributions
        uses: actions/download-artifact@v5
        with:
          name: stemlab-python-distributions
          path: dist

      - name: Publish danceflow-stemlab distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  codex-marketplace:
    name: Publish Codex Git marketplace release channel
    if: startsWith(github.ref, 'refs/tags/v') && vars.CODEX_MARKETPLACE_PUBLISH != 'false'
    needs: [github-release, pypi-publish, codex-package]
    runs-on: ubuntu-24.04
    concurrency:
      group: stemlab-codex-marketplace
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: stemlab-codex-plugin-ubuntu-latest
          path: dist/codex
      - uses: actions/checkout@v7
        with:
          path: marketplace-stage
          fetch-depth: 1
      - name: Prepare the dedicated channel branch (never change main)
        working-directory: marketplace-stage
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin codex-plugins; then
            git fetch origin codex-plugins:refs/remotes/origin/codex-plugins
            git switch -c codex-plugins --track origin/codex-plugins
          else
            git switch --orphan codex-plugins
          fi
      - name: Verify package and update the marketplace contents
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/prepare_codex_marketplace.py \
            --archive "dist/codex/stemlab-codex-plugin-${TAG#v}.zip" \
            --checkout marketplace-stage --tag "$TAG"
      - name: Push release channel without force
        working-directory: marketplace-stage
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins/marketplace.json plugins/stemlab README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish StemLab Codex plugin $TAG"
            git push origin HEAD:codex-plugins
          fi
          echo 'Codex Git marketplace updated; this is not OpenAI public-directory publication.' >> "$GITHUB_STEP_SUMMARY"

  mcp-registry:
    name: Publish to official MCP Registry (opt-in)
    if: startsWith(github.ref, 'refs/tags/v') && vars.MCP_REGISTRY_PUBLISH == 'true' && github.repository == 'kieransimkin/stemlab'
    needs: [github-release, pypi-publish, codex-package]
    runs-on: ubuntu-24.04
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: stemlab-codex-plugin-ubuntu-latest
          path: dist/codex
      - name: Verify PyPI release, authenticate with OIDC and publish metadata
        env:
          TAG: ${{ github.ref_name }}
          MCP_PUBLISHER_VERSION: ${{ vars.MCP_PUBLISHER_VERSION }}
          MCP_PUBLISHER_SHA256: ${{ vars.MCP_PUBLISHER_SHA256 }}
        run: python scripts/publish_mcp_registry.py --metadata dist/codex/stemlab-mcp-server.json --tag "$TAG"
