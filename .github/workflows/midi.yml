name: MIDI adapter and integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,server,midi]"
      - name: Require optional MIDI test dependencies rather than silently skipping
        run: python -c "import pretty_midi, mido, psutil"
      - name: Contract, native MIDI, timeout and integration tests (no model downloads)
        run: python -m pytest tests/test_midi_registry.py tests/test_midi_adapters.py tests/test_midi_extraction.py tests/test_midi_integration.py
      - run: ruff check src tests scripts
      - run: python -m compileall -q src tests scripts
