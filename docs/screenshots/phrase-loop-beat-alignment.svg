<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Default StemLab phrase-loop beat alignment</title>
  <desc id="desc">Generated explanatory diagram showing off-grid lyric-edge cuts expanded to detected beats at the same bar phase.</desc>
  <rect width="1000" height="420" fill="#101523"/>
  <text x="50" y="48" fill="#f4f7ff" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Phrase-loop boundaries: measured beats by default</text>
  <text x="50" y="78" fill="#aab6d3" font-family="system-ui, sans-serif" font-size="15">Generated explanation — not song evidence or a frontend screenshot</text>
  <g stroke="#34415f" stroke-width="2">
    <line x1="100" y1="105" x2="100" y2="355"/><line x1="200" y1="105" x2="200" y2="355"/>
    <line x1="300" y1="105" x2="300" y2="355"/><line x1="400" y1="105" x2="400" y2="355"/>
    <line x1="500" y1="105" x2="500" y2="355"/><line x1="600" y1="105" x2="600" y2="355"/>
    <line x1="700" y1="105" x2="700" y2="355"/><line x1="800" y1="105" x2="800" y2="355"/>
    <line x1="900" y1="105" x2="900" y2="355"/>
  </g>
  <g fill="#7787ab" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="100" y="100">beat 1</text><text x="200" y="100">2</text><text x="300" y="100">3</text><text x="400" y="100">4</text>
    <text x="500" y="100">beat 1</text><text x="600" y="100">2</text><text x="700" y="100">3</text><text x="800" y="100">4</text><text x="900" y="100">beat 1</text>
  </g>
  <text x="50" y="150" fill="#f4f7ff" font-family="system-ui, sans-serif" font-size="16">Canonical lyric target</text>
  <rect x="166" y="165" width="590" height="48" rx="10" fill="#4667a8"/>
  <text x="461" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">complete requested lyric lines</text>
  <g stroke="#ff6577" stroke-width="5">
    <line x1="166" y1="155" x2="166" y2="230"/><line x1="756" y1="155" x2="756" y2="230"/>
  </g>
  <text x="50" y="260" fill="#ff8d9b" font-family="system-ui, sans-serif" font-size="16">Legacy: cuts at red lyric edges → off the beat grid</text>
  <path d="M166 238 L166 285 M756 238 L756 285" stroke="#ff6577" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="100" y="300" width="800" height="52" rx="10" fill="#1a8f7a" opacity="0.9"/>
  <g stroke="#5ff0cf" stroke-width="6">
    <line x1="100" y1="288" x2="100" y2="365"/><line x1="900" y1="288" x2="900" y2="365"/>
  </g>
  <text x="500" y="332" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Default: expand to measured beat 1 → measured beat 1</text>
  <text x="500" y="390" fill="#aab6d3" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Complete bars and exact beat events reduce phase jumps; waveform and listening gates still apply.</text>
</svg>
